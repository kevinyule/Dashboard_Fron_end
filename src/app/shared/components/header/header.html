<div class="flex flex-col-reverse md:flex-row justify-between items-center gap-6 p-4 bg-gradient-to-r from-purple-50/60 via-pink-50/50 to-red-50/40 rounded-xl shadow-2xl">
  <!-- Breadcrumb y título -->
  <div class="capitalize">
    <nav aria-label="breadcrumb" class="w-max mb-2 md:mb-0">
      <ol class="flex items-center bg-purple-50/40 rounded-md p-1">
        <li class="flex items-center text-purple-700 text-sm font-medium hover:text-purple-500 transition">
          <a href="#"><p class="opacity-70 hover:opacity-100">dashboard</p></a>
          <span class="text-purple-300 mx-2 select-none">/</span>
        </li>
        <li class="flex items-center text-purple-700 text-sm font-medium hover:text-purple-500 transition">
          <p class="opacity-70">home</p>
        </li>
      </ol>
    </nav>
    <h6 class="text-red-900 font-bold text-lg tracking-wide">home</h6>
  </div>

  <!-- Buscador y botones -->
  <div class="flex items-center gap-3">
    <!-- Botón notificaciones -->
    <button class="relative w-10 h-10 rounded-lg text-purple-700 hover:bg-purple-100/30 grid place-items-center transition transform hover:scale-110">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
        <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0113.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 01-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 11-7.48 0 24.585 24.585 0 01-4.831-1.244.75.75 0 01-.298-1.205A8.217 8.217 0 005.25 9.75V9zm4.502 8.9a2.25 2.25 0 104.496 0 25.057 25.057 0 01-4.496 0z" clip-rule="evenodd"/>
      </svg>
      <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
    </button>

    <!-- Avatar usuario -->
    <div class="relative w-10 h-10 rounded-full overflow-hidden border-2 border-purple-300 cursor-pointer hover:ring-2 hover:ring-purple-400 transition transform hover:scale-105">
      <img src="https://i.pravatar.cc/40" alt="Avatar" class="w-full h-full object-cover">
    </div>

    <!-- Botón logout -->
    <a (click)="logout()">
      <button class="hidden xl:flex items-center gap-2 px-4 py-2 text-xs font-bold text-purple-700 rounded-lg hover:bg-purple-100/30 active:bg-purple-100/50 transition transform hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="h-5 w-5">
          <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" clip-rule="evenodd"/>
        </svg>
        Log Out
      </button>
    </a>
  </div>
</div>
