<aside class="fixed inset-0 z-50 my-4 ml-4 h-[calc(100vh-32px)] w-72 rounded-xl bg-gradient-to-b from-purple-700 via-pink-700 to-red-600 shadow-2xl transition-transform duration-300 -translate-x-80 xl:translate-x-0">
  <!-- Header -->
  <div class="relative border-b border-white/20">
    <a class="flex items-center gap-4 py-6 px-8 hover:scale-105 transition-transform" href="#/">
      <h6 class="text-white font-extrabold text-lg tracking-wider">My Dashboard</h6>
    </a>
    <button class="absolute right-0 top-0 w-8 h-8 text-white rounded-lg hover:bg-white/20 active:bg-white/30 xl:hidden grid place-items-center">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Menu -->
  <div class="m-4">
    <ul class="flex flex-col gap-3">
      <!-- Dashboard -->
      <li>
        <a routerLink="/dashboard">
          <button routerLinkActive="bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white shadow-lg hover:shadow-xl"
            class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-white font-semibold text-base hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-5 h-5 text-inherit">
              <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"></path>
              <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"></path>
            </svg>
            Dashboard
          </button>
        </a>
      </li>

      <!-- Profile -->
      <li>
        <a routerLink="/profile">
          <button routerLinkActive="bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white shadow-lg hover:shadow-xl"
            class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-white font-semibold text-base hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-inherit">
              <path d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
            </svg>
            Profile
          </button>
        </a>
      </li>

      <!-- Charts -->
      <li>
        <a routerLink="/charts">
          <button routerLinkActive="bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white shadow-lg hover:shadow-xl"
            class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-white font-semibold text-base hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-inherit">
              <path d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
            </svg>
            Charts
          </button>
        </a>
      </li>

      <!-- Tables -->
      <li>
        <a routerLink="/tables">
          <button routerLinkActive="bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white shadow-lg hover:shadow-xl"
            class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-white font-semibold text-base hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-inherit">
              <path d="M1.5 5.625c0-1.036.84-1.875 1.875-1.875h17.25c1.035 0 1.875.84 1.875 1.875v12.75c0 1.035-.84 1.875-1.875 1.875H3.375A1.875 1.875 0 011.5 18.375V5.625z"></path>
            </svg>
            Tables
          </button>
        </a>
      </li>
    </ul>

    <!-- Auth Pages -->
    <div class="mt-6 px-3">
      <p class="text-pink-200 uppercase font-bold text-xs mb-2 opacity-80">Auth Pages</p>
      <ul class="flex flex-col gap-2">
        <li>
          <a href="#">
            <button class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-white font-medium hover:bg-white/10 transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-inherit">
                <path d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5V15a.75.75 0 011.5 0v3.75a3 3 0 01-3 3h-6a3 3 0 01-3-3V5.25a3 3 0 013-3h6a3 3 0 013 3V9A.75.75 0 0115 9V5.25a1.5 1.5 0 00-1.5-1.5h-6z"></path>
              </svg>
              Sign In
            </button>
          </a>
        </li>
        <li>
          <a href="#">
            <button class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-white font-medium hover:bg-white/10 transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-inherit">
                <path d="M6.25 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0z"></path>
                <path d="M3.25 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122z"></path>
              </svg>
              Sign Up
            </button>
          </a>
        </li>
      </ul>
    </div>
  </div>
</aside>
