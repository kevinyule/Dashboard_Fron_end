<div
  class="bg-gradient-to-b from-purple-900 via-indigo-900 to-purple-800 absolute top-0 left-0 bottom-0 w-full h-full"
></div>

<div
  class="relative min-h-screen sm:flex sm:flex-row justify-center bg-transparent rounded-3xl shadow-xl"
>
  <div class="flex-col flex self-center lg:px-14 sm:max-w-4xl xl:max-w-md z-10">
    <div class="self-start hidden lg:flex flex-col text-gray-100">
      <h1 class="my-3 font-semibold text-4xl">Welcome back</h1>
      <p class="pr-3 text-sm opacity-75">
        Lorem ipsum is placeholder text commonly used in the graphic, print, and publishing
        industries for previewing layouts and visual mockups
      </p>
    </div>
  </div>
  <div class="flex justify-center self-center z-10">
    <div class="font-sans">
      <div class="relative min-h-screen flex flex-col sm:justify-center items-center">
        <div class="relative sm:max-w-sm w-full">
          <!-- tarjetas rotadas -->
          <div
            class="card bg-indigo-500 shadow-lg w-full h-full rounded-3xl absolute transform -rotate-6"
          ></div>
          <div
            class="card bg-purple-500 shadow-lg w-full h-full rounded-3xl absolute transform rotate-6"
          ></div>

          <!-- tarjeta principal -->
          <div class="relative w-full rounded-3xl px-6 py-6 bg-white shadow-md">
            <label class="block mt-3 text-lg text-gray-700 text-center font-semibold">
              Login
            </label>
            <form method="#" action="#" class="mt-8 space-y-5">
              <div>
                <input
                  type="email"
                  placeholder="Correo electrónico"
                  class="mt-1 block w-full px-4 border bg-gray-50 h-11 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                />
              </div>

              <div>
                <input
                  type="password"
                  placeholder="Contraseña"
                  class="mt-1 block w-full px-4 border bg-gray-50 h-11 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                />
              </div>

              <div class="flex items-center justify-between text-sm">
                <label class="inline-flex items-center cursor-pointer text-gray-600">
                  <input
                    id="remember_me"
                    type="checkbox"
                    class="rounded border-gray-300 text-indigo-600 shadow-sm focus:ring-indigo-400"
                    name="remember"
                  />
                  <span class="ml-2">Recuérdame</span>
                </label>
                <a class="underline text-gray-600 hover:text-indigo-600" href="#">
                  ¿Olvidó su contraseña?
                </a>
              </div>

              <div>
                <button
                  class="bg-indigo-600 w-full py-3 rounded-xl text-white shadow-md hover:bg-indigo-700 transition duration-300"
                >
                  Login
                </button>
              </div>

              <div class="flex items-center text-center gap-3">
                <hr class="border-gray-300 flex-grow" />
                <span class="block font-medium text-sm text-gray-600"> Accede con </span>
                <hr class="border-gray-300 flex-grow" />
              </div>

              <div class="flex justify-center gap-4">
                <button
                  class="bg-blue-600 px-4 py-2 rounded-xl text-white shadow hover:bg-blue-700 transition"
                >
                  Facebook
                </button>
                <button
                  class="bg-red-500 px-4 py-2 rounded-xl text-white shadow hover:bg-red-600 transition"
                >
                  Google
                </button>
              </div>

              <div class="text-center text-gray-600">
                <span>¿Eres nuevo?</span>
                <a
                  href="#"
                  class="ml-1 text-indigo-600 font-semibold hover:underline"
                >
                  Crea una cuenta
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-transparent absolute w-full bottom-0 left-0 z-30">
  <div class="container p-5 mx-auto flex items-center justify-between">
    <div class="flex mr-auto">
      <a href="https://codepen.io/uidesignhub" target="_blank" class="text-gray-100 flex items-center space-x-2">
        <img src="/storage/avatars/njkIbPhyZCftc4g9XbMWwVsa7aGVPajYLRXhEeoo.jpg" alt="aji" class="object-cover w-10 h-10 rounded-full">
        <p class="text-xl">aji<strong>mon</strong></p>
      </a>
    </div>
  </div>
</footer>
